# openspec/config.yaml
schema: spec-driven

context: |
  Monorepo of MCP (Model Context Protocol) servers exposing read-only tools
  for AI assistants to query business systems (Jira, Tempo, GitLab, etc.).
  Stack: Node.js 22+, JavaScript ESM, @modelcontextprotocol/sdk, Express, Zod.
  Two servers exist under packages/ (jira-tempo/, gitlab/). Shared code in packages/mcp-core/.
  Each server is an independent package in its own subdirectory (no npm workspaces).

rules:
  proposal:
    - Include rollback plan for risky changes
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    - Follow existing code patterns
    tdd: true
    test_command: "cd packages/{server-dir} && node --experimental-vm-modules node_modules/jest/bin/jest.js --forceExit --detectOpenHandles"
  verify:
    test_command: "cd packages/{server-dir} && node --experimental-vm-modules node_modules/jest/bin/jest.js --forceExit --detectOpenHandles"
    build_command: "cd packages/{server-dir} && node --check src/server.js"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas

testing:
  strict_tdd: true
  runner:
    name: Jest
    version: 29.7.0
    command: node --experimental-vm-modules node_modules/jest/bin/jest.js --forceExit --detectOpenHandles
    config: jest.config not found (uses defaults)
  layers:
    unit: true
    integration: false
    e2e: false
  coverage:
    available: true
    command: node --experimental-vm-modules node_modules/jest/bin/jest.js --coverage
  quality:
    linter: ESLint 9.24.0 (flat config)
    linter_cmd: npm run lint
    type_checker: null
    formatter: Prettier 3.5.3
    formatter_cmd: npm run format
